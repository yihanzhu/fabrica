name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required files exist
        run: |
          set -eu
          manifest="ci/required-files.txt"
          if [ ! -f "$manifest" ]; then
            echo "missing manifest: $manifest"; exit 1
          fi
          status=0
          # Read the manifest line by line, skipping blank lines and # comments.
          while IFS= read -r f || [ -n "$f" ]; do
            case "$f" in
              ''|'#'*) continue ;;
            esac
            if [ ! -f "$f" ]; then
              echo "missing required file: $f"; status=1; continue
            fi
            # scripts/*.sh must be executable — a non-+x script is a restore footgun.
            case "$f" in
              scripts/*.sh)
                if [ ! -x "$f" ]; then
                  echo "required script not executable (+x): $f"; status=1
                fi
                ;;
            esac
          done < "$manifest"
          if [ "$status" -ne 0 ]; then
            echo "structure check FAILED"; exit 1
          fi
          echo "structure ok"

      - name: Shellcheck (if any shell scripts)
        env:
          # Pinned shellcheck version — the single source of truth for the
          # version coders must lint against locally. The preinstalled binary on
          # ubuntu-latest drifts on runner-image bumps and disagrees with coders'
          # local installs (different findings + codes for the same issue, e.g.
          # SC2317 vs SC2329), so "clean locally" could land CI-red. Pin it so
          # local↔CI parity is deterministic. Bumping this value is the ONE place
          # the version changes — keep CLAUDE.md / routines/coder*.md in sync.
          SHELLCHECK_VERSION: "0.11.0"
          # GitHub's release-asset digest for the linux.x86_64 tar.xz. Version pinning
          # alone still trusts whatever bytes the download endpoint returns; verify the
          # immutable expected digest before extracting or sudo-installing the binary.
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          # Install the exact pinned release rather than trusting the runner's
          # preinstalled binary: download the official static release and put it
          # on PATH for this step.
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "downloading shellcheck v${SHELLCHECK_VERSION} from $url"
          curl -fsSL "$url" -o /tmp/shellcheck.tar.xz
          printf '%s  %s\n' "$SHELLCHECK_SHA256" /tmp/shellcheck.tar.xz | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          # /usr/local/bin is root-owned and this step runs as the unprivileged
          # `runner` user, so a bare `install` is fragile to runner-image drift
          # (the exact drift this pin exists to prevent). Use passwordless sudo —
          # guaranteed on GitHub-hosted runners — to place it on the standard PATH.
          sudo install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          # Assert the exact version BEFORE the sweep — a silent drift (wrong
          # download, stale PATH shadowing) must fail loudly, not lint quietly
          # under an unexpected version.
          shellcheck --version
          got=$(shellcheck --version | awk '/^version:/ {print $2}')
          if [ "$got" != "$SHELLCHECK_VERSION" ]; then
            echo "shellcheck version mismatch: expected $SHELLCHECK_VERSION, got $got"; exit 1
          fi
          echo "shellcheck version pinned to $got — ok"
          scripts=$(find . -name '*.sh' -not -path './.git/*')
          if [ -n "$scripts" ]; then
            # -S style = shellcheck's default floor; pinned explicitly so the
            # policy is visible and a future default change can't silently relax
            # it. -x follows `source`d files so the `# shellcheck source=...`
            # directives (e.g. scripts/lib/north-star.sh) resolve cleanly.
            echo "$scripts" | xargs shellcheck -x -S style
          else
            echo "no shell scripts yet"
          fi

      - name: North-star resolver tests
        run: |
          # Hermetic bash asserts for scripts/lib/north-star.sh (issue #97). The test
          # builds throwaway git repos and stubs the gh-backed slug helpers, so it needs
          # no network/gh auth. Give git an identity for the temp-repo commits (the runner
          # has no global git user); the test also exports GIT_*_NAME/EMAIL as a backstop.
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          bash scripts/test/north-star-resolver.test.sh

      - name: North-star gate/consumer tests
        run: |
          # Integration asserts for the #98a atomic flip: the manager-review.sh gate and doctor.sh
          # check (h) both read the TARGET's north star, and the gate reads it COMMITTED
          # (both-direction committed test + approval==gate source identity). Hermetic — gh/codex
          # faked on PATH, real git on throwaway repos.
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          bash scripts/test/north-star-gate.test.sh

      - name: models.conf parser tests
        run: |
          # Hermetic bash asserts for scripts/lib/models-conf.sh (mc_parse_target_override) — the
          # P1 fix from the adversarial review of PR #115: a target-committed legacy .fabrica/models.conf
          # is parsed as DATA, never source'd/eval'd, and can never set the gate-effort keys. Plus
          # static (grep-based) assertions that codex-review.sh/manager-review.sh actually wire in
          # the trust-anchor + parse-not-source fix. No git/gh/codex harness needed.
          bash scripts/test/models-conf-parser.test.sh

      - name: Degraded-Codex-review gate tests
        run: |
          # Issue #117: both codex-review.sh and manager-review.sh must FAIL LOUDLY on a
          # degraded/non-substantive Codex run (a code-mode/host spawn failure, or codex exiting
          # non-zero) instead of posting a fake clean verdict. Unit-tests the shared detector
          # (scripts/lib/codex-degraded.sh) in isolation, then runs the REAL scripts end to end
          # with gh/codex stubbed on PATH and real git on throwaway local bare "remotes" — hermetic,
          # no network/gh/codex auth needed.
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          bash scripts/test/codex-degraded-gate.test.sh

      - name: v2 pending-stage tests
        run: |
          # Hermetic asserts for scripts/v2/pending-spec.sh + pending-impl.sh —
          # throwaway git repos, no gh, no network.
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          bash scripts/test/v2-pending-stage.test.sh

      - name: v2 round-cap tests
        run: |
          # Hermetic asserts for scripts/v2/round-cap.sh — gh stubbed on PATH,
          # no network.
          bash scripts/test/v2-round-cap.test.sh

      - name: v2 quota-preflight tests
        run: |
          # Hermetic asserts for scripts/v2/quota-preflight.sh — gh stubbed on
          # PATH, no network. Covers the fail-open hazards the Stack A review
          # found: silent zero-counts and gh outages.
          bash scripts/test/v2-quota-preflight.test.sh

      - name: v2 rename-gate + probe-wrapper guard tests
        run: |
          # Hermetic asserts for scripts/check-rename.sh and the probe
          # wrapper's argument guard — no network, throwaway git repos.
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          bash scripts/test/v2-check-rename.test.sh

      - name: Portable core contract tests
        env:
          # jq 1.6 exactly — core/v1/contracts.jq's canonical-JSON rules depend on this
          # exact release's formatting. The ubuntu-latest preinstalled jq is newer, so a
          # coder testing locally with a different jq version could pass locally and fail
          # here (or vice versa); this pin plus AGENTS.md's local setup keep them in sync.
          # SHA-256 is the official jq-1.6 release asset's digest for jq-linux64.
          JQ16_SHA256: "af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44"
        run: |
          set -euo pipefail
          mkdir -p /tmp/ystack-jq-1.6
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64 \
            -o /tmp/ystack-jq-1.6/jq
          printf '%s  %s\n' "$JQ16_SHA256" /tmp/ystack-jq-1.6/jq | sha256sum -c -
          chmod 0555 /tmp/ystack-jq-1.6/jq
          export PATH="/tmp/ystack-jq-1.6:$PATH"
          got="$(jq --version)"
          if [ "$got" != "jq-1.6" ]; then
            echo "jq version mismatch: expected jq-1.6, got $got"; exit 1
          fi
          echo "jq pinned to $got — ok"
          # This PATH prepend is scoped to this one step; every other step (including
          # Shellcheck's own script sweep above) keeps using the runner's system jq.
          bash scripts/test/core-contract.test.sh

      - name: Rename gate
        run: |
          # Patrols tracked files for old names left over from the rename.
          # Lines labeled legacy and scripts/test/ fixtures are exempt.
          bash scripts/check-rename.sh
