name: Plumbing test

# Manual probe (v2 plan, step 2): can the Claude app push a branch and open a
# PR on its own — and do its events trigger other workflows (does CI run on
# the probe PR)? Run it from the Actions tab on the DEFAULT branch (a
# workflow_dispatch from another ref does not execute the action). Close the
# probe PR without merging and delete its branch afterward. Kept as a
# permanent diagnostic.
#
# Two rules learned the hard way (probe attempts 3-5, then review):
#   1. A `:*` pattern matches only after the COMMAND prefix —
#      `Bash(git push:*)` works, `Bash(git push -u origin some-branch:*)`
#      never matches and the call is silently denied.
#   2. Command-level git patterns are too wide: they permit any refspec. So
#      every write lives in scripts/v2/probe-publish.sh, whose own rules fix
#      the branch name and the single file, and the agent is allowed only to
#      invoke that script. Determinism where it matters, agency where it is
#      being tested.
# The branch name carries run_attempt, so a rerun publishes its own branch
# instead of colliding with the previous attempt's.

on:
  workflow_dispatch: {}

concurrency:
  group: claude-quota

jobs:
  probe:
    # Only the operator starts agent runs (spec R5's actor gate). Both actors
    # checked: on a re-run, github.actor stays the ORIGINAL dispatcher while
    # triggering_actor is whoever clicked re-run (Codex review of #131, P1).
    if: github.actor == 'yihanzhu' && github.triggering_actor == 'yihanzhu'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Probe — push a branch and open a PR
        uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            This is a plumbing probe. Run exactly one command and report its
            full output:

            scripts/v2/probe-publish.sh ${{ github.run_id }} ${{ github.run_attempt }}

            Do nothing else. If it is denied or fails, say so and stop.
          claude_args: >-
            --max-turns 8
            --allowedTools "Bash(scripts/v2/probe-publish.sh:*)"

      - name: Assert the probe PR exists (loud failure, never silent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh pr list --head "plumbing-probe-${{ github.run_id }}-${{ github.run_attempt }}" \
            --json url --jq '.[0].url // empty')"
          if [ -z "$url" ]; then
            echo "::error::The probe PR was not created. Record this on #126 and use the spec's fallback for Stack B."
            exit 1
          fi
          echo "Probe PR: $url"
          echo "Now check that PR: if CI ran on it, app events cascade — record both answers on #126."
