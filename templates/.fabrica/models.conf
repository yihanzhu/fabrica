# Per-target model-tiering override — same format, same keys as the control plane's
# shipped defaults (config/models.conf). This is a STATIC PER-REPO COMMITMENT, never a
# per-task rescue: it is sourced ONCE, AFTER the defaults, so it only needs to set the
# keys this repo wants to change from the shipped default — delete (or never add) any
# key you want left at the default.
#
# Copy this file into your target repo as `.fabrica/models.conf` (mirroring how your
# north star lives at `.fabrica/north-star.md` — see templates/.fabrica/north-star.md),
# edit only the keys you want to override, and commit it. See README.md's "Model
# policy" section for what each key means and the full rationale.
#
# NO BEHAVIOR CHANGE from committing this file alone in this PR: nothing reads a
# target's .fabrica/models.conf yet — that wiring is follow-up work (issues #110-#112).
#
# Example (uncomment and edit the keys you actually want to override; leave the rest
# out so this repo continues to inherit the shipped default for them):
#
# FABRICA_CODER_MODEL=sonnet
# FABRICA_HANDS_MODEL=haiku
# FABRICA_CODEX_MODEL=
# FABRICA_REVIEW_EFFORT=high
# FABRICA_DEBATE_EFFORT=high
