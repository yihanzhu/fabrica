# shellcheck shell=sh
# config/models.conf — ystack model-tiering defaults.
#
# Shell-sourceable (POSIX sh: plain `KEY=value` assignments, no bashisms), so any
# script here can pick it up with `. config/models.conf`. Ships the CONTROL-PLANE
# defaults for every ystack-orchestrated repo. A target repo may commit its own
# `.ystack/models.conf` (same format, same keys — see templates/.ystack/models.conf)
# to override specific values for that repo; the scripts parse it AFTER this file, so
# it only needs to set the keys it wants to change. (Targets still on the old layout
# keep working: the scripts fall back to a committed legacy `.fabrica/models.conf`, and the
# parser accepts the legacy `FABRICA_*` key spellings too — a `YSTACK_*` key wins when
# both are present.) See README.md's "Model policy" section for the full
# spend-by-leverage rationale.
#
# This file is read by the review/debate gates (scripts/codex-review.sh /
# scripts/manager-review.sh), by the coder spawn, and by the hands delegation policy —
# see README.md's "Wiring status" note for the full picture. Gate wiring is script-level
# and live immediately on merge. Coder-spawn and hands-policy wiring lives in the
# manager persona's own instructions (manager/CLAUDE.md and the shipped /yshifu command
# template), so it only takes effect once `scripts/install.sh` regenerates the live
# `/yshifu` command — merging a change to this file alone does not change persona-side
# behavior.
#
# Principle: spend by leverage, not by volume.
#   - Gates (review/debate) decide  -> always MAX capability, never class-routed down.
#   - Producers (coder/hands) type   -> fixed ceilings by design, never escalated at
#     runtime no matter how hard the task looks — decompose the task or fix the spec
#     upstream instead of reaching for a bigger model mid-run.

# --- Producers — fixed ceilings by design; never escalated at runtime -------------

# YSTACK_CODER_MODEL: the Claude coder subagent's model (build + revision routines).
# A FLOATING Claude alias (sonnet/haiku/opus) tracks that alias's latest release; a
# full model ID (e.g. claude-sonnet-4-5-20250929) PINS to an exact snapshot instead —
# both forms are allowed. This is a fixed ceiling BY DESIGN: the coder is never
# escalated to a bigger/frontier model at runtime based on task difficulty.
YSTACK_CODER_MODEL=sonnet

# YSTACK_HANDS_MODEL: the model for "hands" work — mechanical, low-judgment steps
# (e.g. running commands, applying an already-reviewed patch) that don't need the
# coder's full capability. Same never-escalated principle, cheaper ceiling.
YSTACK_HANDS_MODEL=haiku

# --- Gates — always maximum capability; no class-based routing --------------------

# YSTACK_CODEX_MODEL: the Codex model used by the review gate (scripts/codex-review.sh)
# and the manager-debate gate (scripts/manager-review.sh). Empty (the default) means
# "inherit whatever the operator's Codex CLI / ~/.codex/config.toml resolves to" —
# i.e. the operator/CLI's own default frontier codex. Set this only to PIN a specific
# Codex model; gates are never downgraded by task class.
YSTACK_CODEX_MODEL=

# YSTACK_REVIEW_EFFORT: reasoning effort for the code-review gate (codex-review.sh).
YSTACK_REVIEW_EFFORT=high

# YSTACK_DEBATE_EFFORT: reasoning effort for the manager-debate gate (manager-review.sh).
YSTACK_DEBATE_EFFORT=high
