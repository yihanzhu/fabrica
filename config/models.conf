# config/models.conf — Fabrica model-tiering defaults.
#
# Shell-sourceable (POSIX sh: plain `KEY=value` assignments, no bashisms), so any
# script here can pick it up with `. config/models.conf`. Ships the CONTROL-PLANE
# defaults for every Fabrica-orchestrated repo. A target repo may commit its own
# `.fabrica/models.conf` (same format, same keys — see templates/.fabrica/models.conf)
# to override specific values for that repo; it is sourced AFTER this file, so it
# only needs to set the keys it wants to change. See README.md's "Model policy"
# section for the full spend-by-leverage rationale.
#
# NO BEHAVIOR CHANGE from this file alone: nothing reads it yet. Wiring it into the
# coder spawn, the hands policy, and the gates is follow-up work (issues #110-#112).
#
# Principle: spend by leverage, not by volume.
#   - Gates (review/debate) decide  -> always MAX capability, never class-routed down.
#   - Producers (coder/hands) type   -> fixed ceilings by design, never escalated at
#     runtime no matter how hard the task looks — decompose the task or fix the spec
#     upstream instead of reaching for a bigger model mid-run.

# --- Producers — fixed ceilings by design; never escalated at runtime -------------

# FABRICA_CODER_MODEL: the Claude coder subagent's model (build + revision routines).
# A FLOATING Claude alias (sonnet/haiku/opus) tracks that alias's latest release; a
# full model ID (e.g. claude-sonnet-4-5-20250929) PINS to an exact snapshot instead —
# both forms are allowed. This is a fixed ceiling BY DESIGN: the coder is never
# escalated to a bigger/frontier model at runtime based on task difficulty.
FABRICA_CODER_MODEL=sonnet

# FABRICA_HANDS_MODEL: the model for "hands" work — mechanical, low-judgment steps
# (e.g. running commands, applying an already-reviewed patch) that don't need the
# coder's full capability. Same never-escalated principle, cheaper ceiling.
FABRICA_HANDS_MODEL=haiku

# --- Gates — always maximum capability; no class-based routing --------------------

# FABRICA_CODEX_MODEL: the Codex model used by the review gate (scripts/codex-review.sh)
# and the manager-debate gate (scripts/manager-review.sh). Empty (the default) means
# "inherit whatever the operator's Codex CLI / ~/.codex/config.toml resolves to" —
# i.e. the operator/CLI's own default frontier codex. Set this only to PIN a specific
# Codex model; gates are never downgraded by task class.
FABRICA_CODEX_MODEL=

# FABRICA_REVIEW_EFFORT: reasoning effort for the code-review gate (codex-review.sh).
FABRICA_REVIEW_EFFORT=high

# FABRICA_DEBATE_EFFORT: reasoning effort for the manager-debate gate (manager-review.sh).
FABRICA_DEBATE_EFFORT=high
